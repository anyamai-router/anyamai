[server]
host = "0.0.0.0"
port = 3000

[database]
url = "${DATABASE_URL}"
max_connections = 10

[auth]
jwt_secret = "${JWT_SECRET}"

[providers.openai]
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
enabled = true
priority = 1

[models.gpt-4o]
provider = "openai"
enabled = true
priority = 2
max_tokens = 4096

[models.gpt-4o-mini]
provider = "openai"
enabled = true
priority = 1
max_tokens = 4096

[models.gpt-3.5-turbo]
provider = "openai"
enabled = true
priority = 0
max_tokens = 4096
